name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - run: npm ci

      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -H ${{ vars.DEPLOY_HOST }} >> ~/.ssh/known_hosts || true
          test -s ~/.ssh/known_hosts

      # 정적 파일을 /var/www/dongbanhagae.com에 통째로 교체한다. deploy 계정은
      # sudo 권한 없이 이 디렉토리 소유권만 가진 배포 전용 계정이다.
      - name: Deploy to EC2
        run: |
          tar -czf - -C dist . | ssh -i ~/.ssh/deploy_key ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }} \
            'rm -rf /var/www/dongbanhagae.com/* && tar -xzf - -C /var/www/dongbanhagae.com'
